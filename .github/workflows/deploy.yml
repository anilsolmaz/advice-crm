name: Deploy Advice CRM to Oracle Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-oracle-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies & Build on GitHub Runner (16GB RAM)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/advice_crm?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/advice_crm?schema=public"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-role-key"
        run: |
          npm install --production=false
          npx prisma generate
          npm run build
          tar -czf next_build.tar.gz .next

      - name: Upload Pre-Built .next Bundle to Oracle Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "next_build.tar.gz"
          target: "/home/opc/advice-crm"

      - name: Activate Build & Sync Schema on Oracle Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 10m
          script_stop: true
          script: |
            echo "🚀 Canlı Dağıtım Başlatıldı: $(date)"
            cd /home/opc/advice-crm

            echo "📦 1/4: Kodlar GitHub'dan çekiliyor..."
            git fetch origin main
            git reset --hard origin/main

            echo "🗄️ 2/4: Prisma Client & Veritabanı şeması güncelleniyor..."
            npx prisma generate
            npx prisma db push --accept-data-loss --skip-generate

            echo "⚡ 3/4: Hazır Next.js derlemesi (.next) çıkartılıyor..."
            pm2 stop advice-crm || true
            rm -rf .next
            tar -xzf next_build.tar.gz
            rm -f next_build.tar.gz

            echo "🔄 4/4: PM2 servisi başlatılıyor..."
            pm2 restart advice-crm || pm2 start npm --name "advice-crm" -- start
            pm2 save

            echo "✅ Canlı Dağıtım Başarıyla Tamamlandı!"
